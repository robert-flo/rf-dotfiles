onboarding = false

[theme]
name = "solarized"

[theme.custom]
panel_bg = "reset"

[ui]
pane_gaps = false
pane_outer_borders = false
pane_scrollbars = false
hide_tab_bar_when_single_tab = true
tab_bar_position = "bottom"
copy_on_select = false
confirm_close = false
prompt_new_tab_name = false
show_agent_labels_on_pane_borders = true
# No left sidebar by default; toggle with prefix+b
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"
sidebar_width = 20
window_title = "{workspace}: {terminal_title}"

# Show Claude's session summary (its terminal title) instead of the agent name
[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "machine", "workspace", "tab"], ["terminal_title_stripped"]]

[ui.sound.agents]
claude = "off"

[terminal]
new_cwd = "follow"

[session]
resume_agents_on_restore = true

[keys]
prefix = "ctrl+space"

reload_config = "prefix+shift+r"
detach = "prefix+d"

# --- Tabs ---
new_tab = "prefix+c"
close_tab = "prefix+shift+x"
rename_tab = "prefix+r"
next_tab = "prefix+n"
previous_tab = "prefix+p"
switch_tab = ["prefix+1..9", "alt+1..9"]
move_tab_previous = "ctrl+shift+left"
move_tab_next = "ctrl+shift+right"

# --- Paneles ---
focus_pane_left = ["prefix+h", "ctrl+shift+h"]
focus_pane_down = ["prefix+j", "ctrl+shift+j"]
focus_pane_up = ["prefix+k", "ctrl+shift+k"]
focus_pane_right = ["prefix+l", "ctrl+shift+l"]
split_vertical = "prefix+v"
split_horizontal = "prefix+s"
close_pane = "prefix+q"
zoom = "prefix+z"
last_pane = "prefix+backtick"

# --- Workspaces y UI ---
previous_workspace = "alt+shift+left"
next_workspace = "alt+shift+right"
toggle_sidebar = "prefix+b"
copy_mode = "prefix+["
goto = "prefix+f"
open_notification_target = "prefix+shift+n"

# --- Comandos y plugins ---
[[keys.command]]
key = "prefix+o"
type = "shell"
command = 'xdg-open "$HERDR_ACTIVE_PANE_CWD"'

[[keys.command]]
key = "prefix+x"
type = "shell"
command = '''herdr pane list | jq -r --arg t "$HERDR_ACTIVE_TAB_ID" --arg p "$HERDR_ACTIVE_PANE_ID" '.result.panes[] | select(.tab_id == $t and .pane_id != $p) | .pane_id' | xargs -n1 herdr pane close'''

[[keys.command]]
key = "prefix+g"
type = "pane"
command = 'cd "$HERDR_ACTIVE_PANE_CWD" && lazygit'

[[keys.command]]
key = "prefix+i"
type = "shell"
command = '"$HOME/.local/bin/ide"'

[[keys.command]]
key = "prefix+shift+h"
type = "shell"
command = 'herdr pane resize --direction left --pane "$HERDR_ACTIVE_PANE_ID"'

[[keys.command]]
key = "prefix+shift+j"
type = "shell"
command = 'herdr pane resize --direction down --pane "$HERDR_ACTIVE_PANE_ID"'

[[keys.command]]
key = "prefix+shift+k"
type = "shell"
command = 'herdr pane resize --direction up --pane "$HERDR_ACTIVE_PANE_ID"'

[[keys.command]]
key = "prefix+shift+l"
type = "shell"
command = 'herdr pane resize --direction right --pane "$HERDR_ACTIVE_PANE_ID"'

[[keys.command]]
key = "alt+shift+up"
type = "shell"
command = '"$HOME/.local/bin/herdr-move-workspace" up'

[[keys.command]]
key = "alt+shift+down"
type = "shell"
command = '"$HOME/.local/bin/herdr-move-workspace" down'

[[keys.command]]
key = "prefix+up"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "herdr-plus: projects"

[[keys.command]]
key = "prefix+down"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "herdr-plus: quick actions"

[[keys.command]]
key = "prefix+y"
type = "plugin_action"
command = "robert-flo.elio.open"
description = "open file explorer"

[[keys.command]]
key = "prefix+shift+y"
type = "plugin_action"
command = "robert-flo.elio.open-tab"
description = "open file explorer in a new tab"

[experimental]
pane_history = true

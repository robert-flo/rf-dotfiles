disableStartupPopups: true
notARepository: "skip"
promptToReturnFromSubprocess: false
update:
  method: "never"
customCommands:
  - key: "C"
    command: "git cz"
    description: "commit with commitizen"
    context: "files"
    loadingText: "opening commitizen commit tool"
    output: terminal
gui:
  mouseEvents: false
  scrollHeight: 30
  nerdFontsVersion: "3"
  showBottomLine: false
  showCommandLog: false
  showListFooter: false
  showRandomTip: false
  theme:
    activeBorderColor:
      - "magenta"
      - "bold"
    inactiveBorderColor:
      - "black"
git:
  autoFetch: false
  parseEmoji: true
  diffRenderers:
    - command: >-
        sh -c 'if [ "$("$HOME/.local/bin/rf-term-theme" 2>/dev/null || echo dark)" = light ]; then
        exec delta --light --syntax-theme=ansi --paging=never;
        else
        exec delta --dark --syntax-theme=ansi --paging=never;
        fi'

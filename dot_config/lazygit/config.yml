disableStartupPopups: true
notARepository: "skip"
promptToReturnFromSubprocess: false
update:
  method: "never"
customCommands:
  - key: "C"
    command: "git cz"
    description: "commit with commitizen"
    context: "files"
    loadingText: "opening commitizen commit tool"
    output: terminal
gui:
  mouseEvents: false
  scrollHeight: 30
  nerdFontsVersion: "3"
  showBottomLine: false
  showCommandLog: false
  showListFooter: false
  showRandomTip: false
  theme:
    activeBorderColor:
      - "magenta"
      - "bold"
    inactiveBorderColor:
      - "black"
git:
  autoFetch: false
  parseEmoji: true
  diffRenderers:
    - command: delta --dark --syntax-theme="Solarized (dark)" --paging=never

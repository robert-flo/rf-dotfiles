# vim:ft=kitty

## name:     Catppuccin Latte (Clavis Daily Driver - Deep Contrast Edition)
## author:   Catppuccin Org & Clavis Workstation
## blurb:    Calibrated for long daily sessions without eye strain - No washed-out colors

# The basic colors
foreground              #3a3d52
background              #eff1f5
selection_foreground    #3a3d52
selection_background    #ccd0da

# Cursor colors
cursor                  #1e66f5
cursor_text_color       #eff1f5

# URL underline color when hovering with mouse
url_color               #0969da

# Kitty window border colors
active_border_color     #1e66f5
inactive_border_color   #bcc0cc
bell_border_color       #b45309

# OS Window titlebar colors
wayland_titlebar_color  system

# Tab bar colors
active_tab_foreground   #eff1f5
active_tab_background   #1e66f5
inactive_tab_foreground #4c4f69
inactive_tab_background #e6e9ef
tab_bar_background      #dce0e8

# The 16 terminal colors

# black / dark slate (Deep contrast for secondary labels)
color0 #3a3d52
color8 #5c5f77

# red (Ruby / Crimson)
color1 #d20f39
color9 #b91c1c

# green (Rich Forest / Leaf Green)
color2  #2e7d32
color10 #15803d

# yellow / amber (Deep Warm Gold - perfectly readable on light background)
color3  #b45309
color11 #92400e

# blue (Deep Royal & Sapphire Blue - Reemplazado celeste claro por azul profundo)
color4  #1e66f5
color12 #0969da

# magenta (Deep Mauve / Violet)
color5  #7c3aed
color13 #6d28d9

# cyan (Deep Ocean Teal / Petroleum - Reemplazado cyan claro por teal oscuro)
color6  #0f766e
color14 #0e7490

# white / slate (High readability for ANSI white & bright white)
color7  #4c4f69
color15 #181926
